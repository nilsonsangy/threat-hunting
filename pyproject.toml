[project]
name = "thlab"
version = "0.1.0"
description = "Threat hunting lab: exercícios de detecção de ameaça interna (insider threat) sobre o CERT Insider Threat Test Dataset (r4.2)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Nilson Sangy" }]
dependencies = [
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thlab"]

[tool.pytest.ini_options]
# src/ para importar o pacote `thlab`; "." para importar o pacote `exercises`.
pythonpath = ["src", "."]
testpaths = ["tests"]
